[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "climate-attention"
version = "0.1.0"
description = "Reproducible collection of longitudinal media-attention data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Climate Attention contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyarrow>=17,<26",
  "pycountry>=24.6,<27",
  "pytrends-modern>=0.2.12,<0.3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
climate-attention = "climate_attention.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_attention"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
